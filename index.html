<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#041122">
    <meta name="description" content="BlueFox Odyssey V0.16.20">
    <title>BlueFox Odyssey V0.16.20</title>
    <link rel="stylesheet" href="./game.css?v=0.16.20">
    <link rel="stylesheet" href="./journal.css?v=0.16.20">
    <link rel="stylesheet" href="./engine/exploration-hud.css?v=0.16.20">
    <link rel="stylesheet" href="./engine/ui-enhancements.css?v=0.16.20">
  </head>
  <body>
    <div id="file-protocol-warning" hidden>
      <strong>Lancement direct incompatible avec les textures 3D</strong>
      <span>Fermez cet onglet puis double-cliquez sur LANCER_BLUEFOX.bat.</span>
    </div>
    <div id="root"></div>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then((registrations) =>
            Promise.all(registrations.map((registration) => registration.unregister()))
          )
          .catch(() => {});
      }
      if ("caches" in window) {
        caches.keys()
          .then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
          .catch(() => {});
      }
      if (location.protocol === "file:") {
        const warning = document.getElementById("file-protocol-warning");
        warning.hidden = false;
        Object.assign(warning.style, {
          position: "fixed",
          zIndex: "99999",
          inset: "18px 18px auto",
          padding: "16px 20px",
          border: "1px solid rgba(103,225,255,.55)",
          borderRadius: "12px",
          color: "#e7faff",
          background: "rgba(3,14,29,.96)",
          fontFamily: "Segoe UI, sans-serif",
          textAlign: "center",
          boxShadow: "0 12px 40px rgba(0,0,0,.55)"
        });
        warning.querySelector("strong").style.display = "block";
        warning.querySelector("span").style.display = "block";
        warning.querySelector("span").style.marginTop = "6px";
      }
    </script>
    <script src="./map-assets.js?v=0.16.20"></script>
    <script src="./Images/images-catalog.js?v=0.16.20"></script>
    <script src="./engine/bluefox3d-core.js?v=0.16.20"></script>
    <script src="./engine/object-library.js?v=0.16.20"></script>
    <script src="./engine/biome-rules.js?v=0.16.20"></script>
    <script src="./engine/micro-scenes.js?v=0.16.20"></script>
    <script src="./engine/object-spawner.js?v=0.16.20"></script>
    <script src="./engine/map-registry.js?v=0.16.20"></script>
    <script src="./engine/path-planner.js?v=0.16.20"></script>
    <script src="./engine/character-controller.js?v=0.16.20"></script>
    <script src="./engine/camera-controller.js?v=0.16.20"></script>
    <script src="./engine/world-engine.js?v=0.16.20"></script>
    <script src="./game.js?v=0.16.20"></script>
    <script src="./engine/ui-enhancements.js?v=0.16.20"></script>
  </body>
</html>
